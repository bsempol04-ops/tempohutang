name: Build TempoHutang APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Extract project and build APK
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP proyek tidak ditemukan di root repository."
            exit 1
          fi
          mkdir -p project
          unzip -oq "$ZIP_FILE" -d project
          cd project

          # Patch otomatis agar Java & Kotlin kompiler sinkron ke versi 17
          find . -name "build.gradle*" -type f | while read -f; do
            if ! grep -q "jvmToolchain" "$f" && ! grep -q "sourceCompatibility" "$f"; then
              echo "Menambahkan konfigurasi Java 17 ke $f"
              echo -e "\nandroid {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = '17'\n    }\n}" >> "$f"
            fi
          done

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TempoHutang-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
